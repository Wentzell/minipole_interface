name: build_doc

on:
  push:
    branches: [ unstable, '[0-9]+.[0-9]+.x' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_doc:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install ubuntu dependencies
      run: >
        sudo apt-get update &&
        sudo apt-get install
        cmake
        ninja-build
        g++
        gfortran
        hdf5-tools
        libboost-dev
        libomp-dev
        libfftw3-dev
        libgmp-dev
        libhdf5-dev
        libopenblas-dev
        libopenmpi-dev
        openmpi-bin
        openmpi-common
        python3-dev
        python3-mako
        python3-mpi4py
        python3-numpy
        python3-pip
        python3-scipy
        pandoc

    - name: Set up virtualenv
      run: |
        python3 -m venv --system-site-packages $HOME/.venv/my_python
        source $HOME/.venv/my_python/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV

    - name: Build & Install TRIQS
      run: |
        git clone https://github.com/TRIQS/triqs --branch unstable
        cmake -S triqs -B triqs/build -G Ninja -DBuild_Tests=OFF -DUpdate_Python_Bindings=OFF -DCMAKE_INSTALL_PREFIX=$HOME/install
        cmake --build triqs/build --target install --verbose

    - name: Install minipole_interface and docs dependencies
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        pip install -e ".[docs]"

    - name: Build minipole_interface documentation
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        sphinx-build -j auto -b html doc build/doc/html

    - name: Deploy to gh-pages
      if: github.ref_name == 'unstable'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: build/doc/html/
        single-commit: true
